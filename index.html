<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siriya &amp; Floris – 27 03 2027</title>
<meta name="description" content="Siriya & Floris – 27 March 2027 – Baiboon Grand, Loei">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&family=Noto+Serif+Thai:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F1E8; --icy:#DCE5EE; --powder:#BAC7D3; --cherry:#7D0F1A; --wine:#3E0A0F;
  --serif:'Cormorant Garamond','Noto Serif Thai',Georgia,serif; --sans:'Jost','Noto Serif Thai',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--cherry);font-family:var(--sans);font-weight:300;line-height:1.7;font-size:1.05rem}
html[lang=th] body{line-height:1.9}
html[lang=th] em,html[lang=th] h3,html[lang=th] .pre{font-style:normal}
.lang{position:fixed;top:1.4rem;right:1.6rem;z-index:5;display:flex;gap:.2rem}
.lang button{background:none;border:0;color:var(--cherry);opacity:.55;font:inherit;font-size:.95rem;padding:.3rem .55rem;cursor:pointer;border-bottom:1px solid transparent}
.lang button[aria-pressed=true]{opacity:1;border-bottom-color:var(--cherry)}
.page{min-height:100svh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 2rem 4rem}
.page::before{content:"";position:absolute;inset:1.1rem;border:1px solid var(--powder);pointer-events:none}
.pre{font-family:var(--serif);font-style:italic;font-size:1.3rem;margin-bottom:.8rem}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(3rem,11vw,6.5rem);line-height:1;letter-spacing:-.01em}
h1 .amp{font-style:italic;font-size:.55em;margin:0 .15em;opacity:.8}
.arch{width:min(17rem,70vw);aspect-ratio:3/4;max-height:44svh;margin:2rem 0;border-radius:50% 50% 0 0 / 38% 38% 0 0;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--icy),var(--powder));display:grid;place-items:center}
.ph{font-family:var(--serif);font-style:italic;color:#fff;font-size:1.1rem;opacity:.9}
.arch img,.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.when{font-family:var(--serif);font-size:clamp(1.4rem,4vw,1.9rem);font-weight:400}
.where{opacity:.8;margin-top:.1rem}
.cue{margin-top:1.5rem;color:var(--cherry);opacity:.6;font-size:1.4rem;text-decoration:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.reveal{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
.reveal.d2{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,6vw,3rem);line-height:1.2;margin-bottom:1.2rem}
.msg{max-width:36rem;font-family:var(--serif);font-size:1.25rem;line-height:1.8}
.grid{width:100%;max-width:52rem;margin:2.5rem 0 2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
.grid div{padding:1rem}
.grid div+div{border-left:1px solid var(--powder)}
.ico{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--icy);display:grid;place-items:center;margin:0 auto .8rem}
.ico svg{width:1.7rem;height:1.7rem;stroke:var(--cherry);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.grid h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.25rem;margin-bottom:.2rem}
.grid p{font-family:var(--serif);font-size:1.5rem;line-height:1.3}
.grid small{display:block;font-size:.9rem;opacity:.75;margin-top:.3rem}
@media(max-width:640px){.grid div+div{border-left:0;border-top:1px solid var(--powder)}}
.pair{display:flex;gap:1rem;justify-content:center;width:100%;max-width:30rem}
.sq{position:relative;flex:1;aspect-ratio:1;max-height:10rem;background:linear-gradient(160deg,var(--icy),var(--powder));overflow:hidden;display:grid;place-items:center}
:focus-visible{outline:2px solid var(--cherry);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.reveal,.cue{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<nav class="lang" aria-label="ภาษา / Language / Taal">
  <button data-l="th" aria-pressed="true" lang="th">ไทย</button>
  <button data-l="en" aria-pressed="false">EN</button>
  <button data-l="nl" aria-pressed="false">NL</button>
</nav>

<!-- Pagina 1 -->
<main>
<section class="page" id="p1">
  <p class="pre reveal" data-t="pre"></p>
  <h1 class="reveal d2">Siriya <span class="amp">&amp;</span> Floris</h1>
  <div class="arch reveal d2"><span class="ph" data-t="photo1"></span><img src="images/foto-1.jpg" alt="" onerror="this.remove()"></div>
  <p class="when reveal d2" data-t="when"></p>
  <p class="where reveal d2" data-t="where"></p>
  <a class="cue" href="#p2" aria-label="Volgende pagina / Next / ถัดไป">&#8964;</a>
</section>

<!-- Pagina 2 -->
<section class="page" id="p2">
  <h2 data-t="invite"></h2>
  <p class="msg" data-t="lorem"></p>
  <div class="grid">
    <div>
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <h3 data-t="dateL"></h3><p data-t="dateV"></p><small data-t="dateS"></small>
    </div>
    <div>
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg></span>
      <h3 data-t="timeL"></h3><p data-t="timeV"></p><small data-t="timeS"></small>
    </div>
    <div>
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></span>
      <h3 data-t="locL"></h3><p>Baiboon Grand</p><small data-t="locS"></small>
    </div>
  </div>
  <div class="pair">
    <div class="sq"><span class="ph" data-t="photo2"></span><img src="images/foto-2.jpg" alt="" onerror="this.remove()"></div>
    <div class="sq"><span class="ph" data-t="photo3"></span><img src="images/foto-3.jpg" alt="" onerror="this.remove()"></div>
  </div>
</section>
</main>

<script>
const L = {
  th: {
    pre:"เรากำลังจะแต่งงานกัน", when:"วันเสาร์ที่ 27 มีนาคม พ.ศ. 2570", where:"Baiboon Grand จังหวัดเลย",
    invite:"ด้วยความยินดี ขอเรียนเชิญท่านร่วมเป็นเกียรติ",
    lorem:"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.",
    dateL:"วันที่", dateV:"27 มีนาคม 2570", dateS:"วันเสาร์ (ค.ศ. 2027)",
    timeL:"เวลา", timeV:"09.00 น.", timeS:"ต้อนรับแขกตั้งแต่ 08.30 น.",
    locL:"สถานที่", locS:"จังหวัดเลย ประเทศไทย",
    photo1:"ภาพที่ 1", photo2:"ภาพที่ 2", photo3:"ภาพที่ 3"
  },
  en: {
    pre:"We are getting married", when:"Saturday, 27 March 2027", where:"Baiboon Grand, Loei",
    invite:"With joy, we invite you",
    lorem:"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.",
    dateL:"Date", dateV:"27 March 2027", dateS:"Saturday",
    timeL:"Time", timeV:"9:00 AM", timeS:"guests welcome from 8:30 AM",
    locL:"Location", locS:"Loei, Thailand",
    photo1:"Photo 1", photo2:"Photo 2", photo3:"Photo 3"
  },
  nl: {
    pre:"Wij gaan trouwen", when:"Zaterdag 27 maart 2027", where:"Baiboon Grand, Loei",
    invite:"Met blijdschap nodigen wij u uit",
    lorem:"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.",
    dateL:"Datum", dateV:"27 maart 2027", dateS:"zaterdag",
    timeL:"Tijd", timeV:"09:00 uur", timeS:"ontvangst om 08:30",
    locL:"Locatie", locS:"Loei, Thailand",
    photo1:"Foto 1", photo2:"Foto 2", photo3:"Foto 3"
  }
};
function setLang(l){
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = L[l][e.dataset.t]);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
const q = new URLSearchParams(location.search).get('lang');
setLang(q in L ? q : 'th');
</script>
</body>
</html>
