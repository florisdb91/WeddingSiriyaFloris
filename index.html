<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Great+Vibes&family=Noto+Serif+Thai:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F1E8; --icy:#DCE5EE; --sand:#EFE4D6; --blush:#C97C82; --rose:#A8363F; --powder:#BAC7D3; --cherry:#7D0F1A; --wine:#3E0A0F;
  --serif:'Cormorant Garamond','Noto Serif Thai',Georgia,serif; --script:'Great Vibes','Brush Script MT',cursive;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--cherry);font-family:var(--serif);font-weight:400;line-height:1.7;font-size:1.1rem}
html[lang=th] body{line-height:1.9}
.lang{position:fixed;top:1.2rem;right:1.4rem;z-index:5;display:flex;gap:.2rem}
.lang button{background:none;border:0;color:var(--cherry);opacity:.5;font:inherit;font-size:.95rem;padding:.3rem .55rem;cursor:pointer;border-bottom:1px solid transparent}
.lang button[aria-pressed=true]{opacity:1;border-bottom-color:var(--cherry)}
.page{min-height:100svh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5.5rem 1.5rem 4rem;
  background:radial-gradient(ellipse 90% 50% at 50% 105%,rgba(125,15,26,.09),transparent 70%),linear-gradient(180deg,var(--ivory),var(--sand))}
.page::before{content:"";position:absolute;inset:1rem;border:1px solid var(--powder);pointer-events:none;z-index:1}
.page>*:not(.deco){position:relative;z-index:2}
.deco{position:absolute;z-index:1;pointer-events:none}
.tl{top:0;left:0;width:min(17rem,58vw)}
.tr{top:5rem;right:0;width:min(9rem,30vw);opacity:.8}
.bl{bottom:0;left:0;width:min(8.5rem,26vw);height:62%}
.br{bottom:0;right:0;width:min(8.5rem,26vw);height:62%;transform:scaleX(-1)}
.page>.logo{position:absolute;top:1.7rem;left:50%;transform:translateX(-50%);z-index:3;width:3.4rem;height:3.4rem;display:grid;place-items:center}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.logo .mono{width:100%;height:100%;border-radius:50%;border:1px solid var(--powder);display:grid;place-items:center;font-family:var(--script);font-size:1.25rem;line-height:1;color:var(--cherry)}
.logo.has .mono{display:none}
.caps{font-size:.88rem;letter-spacing:.24em;text-transform:uppercase;font-weight:500;line-height:1.9}
html[lang=th] .caps{letter-spacing:.06em;font-size:1rem}
h1{font-family:var(--script);font-weight:400;line-height:1.05;margin:1.4rem 0 2.2rem;display:flex;flex-direction:column;align-items:flex-start;font-size:clamp(4rem,19vw,7rem);filter:drop-shadow(0 1px 0 rgba(62,10,15,.08))}
h1 .n2{margin-left:clamp(2rem,16vw,5rem);margin-top:-.15em}
h1 .amp{font-size:.62em;margin-right:.12em;color:var(--rose)}
.info>.rule{flex:none;width:1px;align-self:stretch;background:var(--powder)}
.info{display:flex;gap:1.6rem;align-items:stretch;justify-content:center;margin:1.6rem 0 0;max-width:34rem}
.info>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:.35rem}
.info svg{width:3.6rem;height:3.6rem;padding:.55rem;border-radius:50%;background:var(--icy)}
.sub{font-size:.8rem;letter-spacing:.12em;opacity:.85}
html[lang=th] .sub{letter-spacing:.03em;font-size:.95rem}
.arch{width:min(11rem,40vw);aspect-ratio:3/4;max-height:30svh;margin-top:2rem;border-radius:50% 50% 0 0 / 36% 36% 0 0;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--icy),var(--powder));display:grid;place-items:center}
.ph{font-style:italic;color:#fff;font-size:1.05rem;opacity:.95}
.arch img,.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cue{margin-top:1.2rem;color:var(--cherry);opacity:.55;font-size:1.5rem;text-decoration:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.reveal{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
.reveal.d2{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-family:var(--script);font-weight:400;font-size:clamp(2.6rem,10vw,4rem);line-height:1.2;margin-bottom:1rem}
html[lang=th] h2{font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,6vw,2.8rem)}
.msg{max-width:34rem;font-size:1.25rem;line-height:1.8}
.grid{width:100%;max-width:52rem;margin:2.2rem 0 2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
.grid>div{padding:1rem}
.grid>div+div{border-left:1px solid var(--powder)}
.ico{width:3.5rem;height:3.5rem;border-radius:50%;background:var(--icy);display:grid;place-items:center;margin:0 auto .7rem}
.ico svg{width:1.7rem;height:1.7rem;stroke:var(--cherry);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.grid h3{font-weight:500;font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:.2rem}
html[lang=th] .grid h3{letter-spacing:.04em;font-size:1.05rem}
.grid p{font-size:1.5rem;line-height:1.3}
.grid small{display:block;font-size:.95rem;opacity:.8;margin-top:.3rem}
@media(max-width:640px){.grid>div+div{border-left:0;border-top:1px solid var(--powder)}}
.pair{display:flex;gap:1rem;justify-content:center;width:100%;max-width:28rem}
.sq{position:relative;flex:1;aspect-ratio:1;max-height:9.5rem;background:linear-gradient(160deg,var(--icy),var(--powder));overflow:hidden;display:grid;place-items:center;border-radius:.2rem}
:focus-visible{outline:2px solid var(--cherry);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.reveal,.cue{animation:none}html{scroll-behavior:auto}}
</style>
</head>

function setLang(l){
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = L[l][e.dataset.t]);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
const q = new URLSearchParams(location.search).get('lang');
setLang(q in L ? q : 'th');
