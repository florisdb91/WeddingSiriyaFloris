<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siriya &amp; Floris – 27 03 2027</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+Thai:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F7F1E8;--icy:#DCE5EE;--powder:#BAC7D3;--stripe:#B9CBDD;--blue:#8EA9C6;--cherry:#7D0F1A;--serif:'Cormorant Garamond','Noto Serif Thai',Georgia,serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--cherry);color:var(--cherry);font-family:var(--serif);font-weight:400;line-height:1.7;font-size:1.1rem}
html[lang=th] body{line-height:1.9}
.lang{position:fixed;top:.9rem;right:.9rem;z-index:6;display:flex;gap:.1rem;background:rgba(247,241,232,.92);border-radius:2rem;padding:.15rem .35rem}
.lang button{background:none;border:0;color:var(--cherry);opacity:.55;font:inherit;font-size:.92rem;padding:.2rem .5rem;cursor:pointer;border-bottom:1px solid transparent}
.lang button[aria-pressed=true]{opacity:1;border-bottom-color:var(--cherry)}
.page{min-height:100svh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.page>.logo{position:absolute;top:.9rem;left:.9rem;z-index:3;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--ivory);border:1px solid var(--powder);display:grid;place-items:center;overflow:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:.25rem}
.logo .mono{font-size:1.05rem;font-style:italic;line-height:1;color:var(--cherry)}
.logo.has .mono{display:none}
/* pagina 1 */
#p1{padding:5.2rem 0 3rem;background:
 repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 4px),
 repeating-linear-gradient(90deg,var(--cherry) 0 1.4rem,var(--ivory) 1.4rem 1.75rem,var(--blue) 1.75rem 3.15rem,var(--ivory) 3.15rem 3.5rem)}
.wrap{position:relative;width:min(96vw,30rem);aspect-ratio:1;container-type:inline-size;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cart{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(62,10,15,.28))}
.c{position:absolute;inset:13% 12% 12%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--cherry)}
.caps{font-size:max(.6rem,3cqw);letter-spacing:.2em;text-transform:uppercase;font-weight:500;line-height:1.7}
html[lang=th] .caps{font-size:max(.72rem,3.7cqw);letter-spacing:.02em}
h1{font-weight:300;font-size:15.5cqw;line-height:1.02;margin:3cqw 0 4cqw;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center}
h1 .amp{font-style:italic;font-size:.7em;color:#A8363F}
.info{display:flex;gap:3cqw;width:100%;margin-top:5cqw;align-items:stretch}
.info>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.4cqw}
.info>.rule{flex:none;width:1px;background:rgba(125,15,26,.4)}
.info svg{width:8cqw;height:8cqw}
.sub{font-size:max(.58rem,2.7cqw);letter-spacing:.08em;opacity:.9}
html[lang=th] .sub{letter-spacing:.02em;font-size:max(.7rem,3.3cqw)}
.cue{margin-top:1rem;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--ivory);color:var(--cherry);display:grid;place-items:center;text-decoration:none;font-size:1.3rem;line-height:1;padding-bottom:.35rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
/* pagina 2 */
#p2{justify-content:flex-start;color:#fff;padding:5.5rem 1.6rem 4rem;background:radial-gradient(ellipse 80% 50% at 50% 0,#8A1220,transparent 70%),linear-gradient(180deg,#6F0D18,#560a12)}
#p2>*:not(.logo){width:100%;max-width:34rem}
.title{font-weight:300;font-style:italic;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1.1;margin-bottom:1rem}
html[lang=th] .title{font-style:normal;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.4}
.msg{font-size:1.1rem;line-height:1.7;opacity:.92}
#p2>.bar{width:3rem;height:1px;background:var(--powder);margin:2rem auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.ico{width:3.2rem;height:3.2rem;border-radius:50%;border:1px solid var(--powder);background:rgba(220,229,238,.12);display:grid;place-items:center;margin:0 auto .7rem}
.ico svg{width:1.6rem;height:1.6rem;stroke:var(--icy);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.h{color:var(--icy);font-weight:500;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;line-height:1.6}
html[lang=th] .h{letter-spacing:.03em;font-size:1rem}
.grid p{font-size:1.15rem;line-height:1.3;margin-top:.15rem}
.grid small{display:block;font-size:.85rem;opacity:.8;line-height:1.4;margin-top:.2rem}
.sec p{margin-top:.5rem;font-size:1.05rem;opacity:.92}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.sq{position:relative;aspect-ratio:1;border:3px solid var(--icy);overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,var(--icy),var(--powder))}
.sq:first-child{grid-column:span 2;aspect-ratio:16/10}
.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ph{font-style:italic;color:var(--cherry);opacity:.8;font-size:1.05rem}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
#p1 :focus-visible{outline-color:var(--cherry)}
@media(prefers-reduced-motion:reduce){.wrap,.cue{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

function setLang(l){
  document.documentElement.lang = l;
